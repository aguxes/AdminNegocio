<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminNegocio Web</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Estilos Propios -->
    <link rel="stylesheet" href="estilos/estilos.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .sidebar {
            height: 100vh;
            background-color: #343a40; /* Dark gray */
            color: white;
            padding-top: 20px;
            position: fixed;
            width: 250px;
        }
        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 1.1rem;
            color: #d1d1d1;
            display: block;
            transition: 0.3s;
        }
        .sidebar a:hover, .sidebar a.active {
            color: #ffffff;
            background-color: #0d6efd; /* Bootstrap Primary Blue */
        }
        .sidebar i {
            margin-right: 10px;
        }
        .content {
            margin-left: 250px; /* Same as sidebar width */
            padding: 20px;
        }
        .card {
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: none;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h3 class="text-center mb-4"><i class="bi bi-shop"></i> AdminNegocio</h3>
        <a href="#" onclick="cargarVista('inicio')" class="nav-link active" id="link-inicio"><i class="bi bi-house-door"></i> Inicio</a>
        <a href="#" onclick="cargarVista('clientes')" class="nav-link" id="link-clientes"><i class="bi bi-people"></i> Clientes</a>
        <a href="#" onclick="cargarVista('productos')" class="nav-link" id="link-productos"><i class="bi bi-box-seam"></i> Productos</a>
        <a href="#" onclick="cargarVista('ventas')" class="nav-link" id="link-ventas"><i class="bi bi-cart"></i> Ventas</a>
        <a href="#" onclick="cargarVista('empleados')" class="nav-link" id="link-empleados"><i class="bi bi-person-badge"></i> Empleados</a>
    </div>

    <!-- Main Content -->
    <div class="content">
        <!-- Navbar Superior (Opcional, para usuario logueado o notificaciones) -->
        <nav class="navbar navbar-light bg-white mb-4 shadow-sm rounded">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1" id="page-title">Bienvenido</span>
                <div class="d-flex">
                   <span class="text-muted"><i class="bi bi-person-circle"></i> Usuario</span>
                </div>
            </div>
        </nav>

        <!-- Dynamic View Container -->
        <div id="app-container">
            <!-- El contenido se cargará aquí vía JS -->
            <div class="row">
                <div class="col-md-12">
                    <div class="card p-5 text-center">
                        <h1>👋 ¡Hola!</h1>
                        <p class="lead">Selecciona una opción del menú para comenzar a gestionar tu negocio.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 para alertas bonitas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Nuestro Script Principal -->
    <script src="js/Main.js"></script>
</body>
</html>
